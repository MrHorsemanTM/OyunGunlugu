<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Günlüğü - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-secondary text-light p-4 shadow">
                <h2 class="text-center mb-4">Yeni Hesap Oluştur</h2>

                <div id="messageBox" class="alert d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Kullanıcı Adı</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresi</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Şifre</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Kayıt Ol</button>
                </form>

                <div class="text-center mt-3">
                    <p class="mb-0">Zaten hesabın var mı? <a href="/login.html" class="text-info">Giriş Yap</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Sayfanın yenilenmesini engelle

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageBox = document.getElementById('messageBox');

        try {
            // Yazdığımız Node.js API'sine istek atıyoruz
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });

            const result = await response.json();

            if (result.success) {
                messageBox.className = "alert alert-success";
                messageBox.innerText = result.message + " Giriş sayfasına yönlendiriliyorsunuz...";
                messageBox.classList.remove('d-none');
                
                // 2 saniye sonra login sayfasına yönlendir
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } else {
                messageBox.className = "alert alert-danger";
                messageBox.innerText = result.message;
                messageBox.classList.remove('d-none');
            }
        } catch (error) {
            messageBox.className = "alert alert-danger";
            messageBox.innerText = "Sunucu ile iletişim kurulurken bir hata oluştu.";
            messageBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
