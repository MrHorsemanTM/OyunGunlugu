<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Günlüğü - Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-secondary text-light p-4 shadow">
                <h2 class="text-center mb-4">Giriş Yap</h2>

                <div id="messageBox" class="alert d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresi</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Şifre</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-3">Giriş Yap</button>
                </form>

                <div class="text-center mt-3">
                    <p class="mb-0">Henüz hesabın yok mu? <a href="/register.html" class="text-info">Kayıt Ol</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Scriptin HTML tamamen yüklendikten sonra çalıştığından emin oluyoruz
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm');
        if(loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const messageBox = document.getElementById('messageBox');

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const result = await response.json();

                    if (result.success) {
                        messageBox.className = "alert alert-success";
                        messageBox.innerText = "Giriş başarılı! Yönlendiriliyorsunuz...";
                        messageBox.classList.remove('d-none');
                        
                        setTimeout(() => {
                            window.location.href = '/index.html'; 
                        }, 1500);
                    } else {
                        messageBox.className = "alert alert-danger";
                        messageBox.innerText = result.message;
                        messageBox.classList.remove('d-none');
                    }
                } catch (error) {
                    messageBox.className = "alert alert-danger";
                    messageBox.innerText = "Sunucu ile iletişim hatası.";
                    messageBox.classList.remove('d-none');
                }
            });
        }
    });
</script>
</body>
</html>
